<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Parent / guardian permission - MTB 12 Team</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/team-favicon-32.png">
<style>
 body{margin:0;background:#f6f7f7;color:#1d2321;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
 main{max-width:640px;margin:0 auto;padding:20px 16px 40px}
 header{display:flex;align-items:center;gap:10px;margin-bottom:8px}header img{width:44px;height:44px;border-radius:10px}
 h1{font-size:22px;margin:4px 0 12px}h2{font-size:16px;margin:16px 0 4px}
 .card{background:#fff;border:1px solid #dde3e2;border-radius:12px;padding:16px;margin:12px 0}
 label{display:block;font-size:14px;margin:12px 0 4px;font-weight:600}
 input[type=text]{width:100%;box-sizing:border-box;padding:11px;font-size:16px;border:1px solid #b9c4c2;border-radius:8px}
 .agree{display:flex;gap:10px;align-items:flex-start;font-weight:normal;margin-top:16px}.agree input{width:22px;height:22px;flex:none;margin-top:2px}
 button{width:100%;padding:13px;font-size:17px;font-weight:700;border:0;border-radius:10px;background:#1f9e92;color:#fff;margin-top:16px}
 button:disabled{opacity:.6}.err{color:#b3261e;margin-top:10px}.ok{background:#e6f6f3;border-color:#9fd8cf}.muted{color:#5f6b69;font-size:13px}
</style>
</head>
<body><main>
<header><img src="icons/team-icon-192.png" alt=""><b>MTB 12 Team</b></header>
<div id="app"><p class="muted">Loading…</p></div>
</main>
<script>
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const token = location.hash.slice(1);
let RELAY;
async function api(method, body) {
  RELAY ||= (await (await fetch('relay.json', { cache: 'no-store' })).json()).url.replace(/\/$/, '');
  const r = await fetch(`${RELAY}/consent/${encodeURIComponent(token)}`, { method, headers: body ? { 'Content-Type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || 'Something went wrong - please try again.'); return j;
}
function done(i) {
  $('#app').innerHTML = `<div class="card ok"><h1>Thank you ✓</h1><p>Permission is recorded for <b>${esc(i.student)}</b> for the ${esc(i.season)} season. They can now open the app and continue.</p>
   <p class="muted">You can close this page. To withdraw permission at any time, contact ${esc(i.admin)}.</p></div>`;
}
(async () => {
  if (!token) { $('#app').innerHTML = '<div class="card">This link is incomplete. Ask the student to send it again.</div>'; return; }
  let i; try { i = await api('GET'); } catch (e) { $('#app').innerHTML = `<div class="card">${esc(e.message)}</div>`; return; }
  if (i.already) return done(i);
  const S = esc(i.student);
  $('#app').innerHTML = `<h1>Permission for ${S} to use MTB 12 Team</h1>
  <div class="card">
   <p>${S}'s mountain bike coaches with ${esc(i.team)} use the MTB 12 Team app to follow a 12-week strength and fitness program. Because ${S} is under 18, we ask a parent or guardian to give permission before they can use it.</p>
   <h2>What the app records</h2><p>The workouts ${S} logs - sessions, sets, weights, reps and times, interval sessions (including heart rate if they enter it), stretches, rides they log, and their goal sheet.</p>
   <h2>Who can see it</h2><p>${S}, their ride lead and the head coach. Goal-sheet answers are private unless ${S} chooses to share them. Other athletes can't see ${S}'s data unless both agree to be training buddies.</p>
   <h2>What the app does not do</h2><p>There is no messaging or chat. It doesn't track location. Data isn't sold or shared outside the coaching team.</p>
   <h2>Strava is optional</h2><p>If ${S} connects their own Strava account, workouts can be added to it. Strava has its own minimum age and terms.</p>
   <h2>Changing your mind</h2><p>Ask ${esc(i.admin)} at any time and ${S}'s data will be deleted. We'll ask you to confirm again at the start of each season.</p>
  </div>
  <div class="card">
   <label for="pn">Parent / guardian name</label><input type="text" id="pn" autocomplete="name">
   <label for="pc">Phone or email</label><input type="text" id="pc" autocomplete="email">
   <label class="agree"><input type="checkbox" id="pa"><span>I give permission for ${S} to use MTB 12 Team for the ${esc(i.season)} season.</span></label>
   <button id="go">Give permission</button><div class="err" id="err"></div>
   <p class="muted">Wording version ${esc(i.version)}</p>
  </div>`;
  $('#go').onclick = async () => {
    $('#go').disabled = true; $('#err').textContent = '';
    try { done(await api('POST', { parentName: $('#pn').value, contact: $('#pc').value, agree: $('#pa').checked })); }
    catch (e) { $('#err').textContent = e.message; $('#go').disabled = false; }
  };
})();
</script>
</body>
</html>
